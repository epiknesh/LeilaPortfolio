backend:
  name: github
  repo: epiknesh/LeilaPortfolio
  branch: main

# Netlify rebuilds the site automatically on every push to `main` (already
# wired up via the GitHub integration) — no separate publish step needed.
publish_mode: simple

media_folder: "public/images/curated"
public_folder: "/images/curated"

collections:
  - name: projects
    label: "Projects"
    folder: "src/content/projects"
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: title
    fields:
      - label: "Category"
        name: category
        widget: relation
        collection: categories
        search_fields: ["title"]
        display_fields: ["title"]
        value_field: "{{slug}}"
        hint: "Pick from existing categories, or add a new one first under the Categories collection."
      - { label: "Title", name: title, widget: string }
      - { label: "Subtitle", name: subtitle, widget: string, required: false }
      - { label: "Project Type", name: projectType, widget: string }
      - { label: "Industry", name: industry, widget: string }
      - label: "Deliverables"
        name: deliverables
        widget: list
        field: { label: "Deliverable", name: item, widget: string }
      - label: "Color Palette"
        name: palette
        widget: list
        fields:
          - { label: "Hex", name: hex, widget: color }
          - { label: "Name", name: name, widget: string, required: false }
      - { label: "Process Notes", name: process, widget: text, required: false, hint: "Optional — shown in a collapsible 'process & references' panel on the project page." }
      - { label: "Card Image (grid thumbnail)", name: cardImage, widget: image }
      - { label: "Hero Image (project page top)", name: hero, widget: image }
      - label: "Gallery Images"
        name: gallery
        widget: list
        summary: "{{fields.image}} ({{fields.size}})"
        fields:
          - { label: "Image", name: image, widget: image }
          - label: "Display Size"
            name: size
            widget: select
            default: "standard"
            options:
              - { label: "Standard (half width)", value: "standard" }
              - { label: "Wide (two-thirds width)", value: "wide" }
              - { label: "Portrait (narrower, taller crop)", value: "portrait" }
              - { label: "Full width", value: "full" }
      - { label: "Description", name: body, widget: markdown, hint: "The project write-up paragraphs." }
      - label: "Grid Order"
        name: order
        widget: number
        default: 0
        hint: "Controls where this project appears in the homepage grid — lower numbers show first."

  - name: categories
    label: "Categories"
    folder: "src/content/categories"
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: title
    fields:
      - { label: "Title", name: title, widget: string, hint: "Shown as a filter pill on the homepage, e.g. 'Branding & Visual Identity'." }
      - { label: "Order", name: order, widget: number, default: 0, hint: "Lower numbers appear first among the filter pills." }

  - name: software
    label: "Software"
    folder: "src/content/software"
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: name
    fields:
      - { label: "Name", name: name, widget: string, hint: "Shown next to the icon, e.g. 'Adobe Illustrator'." }
      - label: "Icon"
        name: icon
        widget: string
        hint: "Filename (without .svg) of an existing icon in src/icons/software/ — e.g. 'illustrator'. Adding a brand-new icon file needs a code change; ask if a tool you want to add doesn't have one yet."
      - label: "Tier"
        name: tier
        widget: select
        default: "secondary"
        options:
          - { label: "Primary", value: "primary" }
          - { label: "Secondary", value: "secondary" }
          - { label: "Basic", value: "basic" }
      - label: "Order"
        name: order
        widget: number
        default: 0
        hint: "Lower numbers appear first within its tier."

  - name: home
    label: "Homepage"
    files:
      - name: home
        file: "src/content/pages/home.md"
        label: "Homepage Intro"
        fields:
          - { label: "Intro line (under the about heading)", name: introLine, widget: text }
          - label: "Logo"
            name: logoImage
            widget: image
            required: false
            hint: "Replaces the '[ logo placeholder — about [me] ]' box at the top of the homepage intro once uploaded."
          - label: "Typescript / Wordmark"
            name: typescriptImage
            widget: image
            required: false
            hint: "Replaces the '[ typescript placeholder ]' box below the logo once uploaded."

  - name: about
    label: "About Page"
    files:
      - name: about
        file: "src/content/pages/about.md"
        label: "About Page Content"
        fields:
          - label: "Portrait Photo"
            name: portrait
            widget: image
            hint: "The illustrated self-portrait shown at the top of the About page."
          - { label: "Hero Lede", name: heroLede, widget: text }
          - { label: "Narrative Heading", name: narrativeHeading, widget: string, hint: "Use a line break for a two-line heading, e.g. 'Two disciplines,\\none instinct.'" }
          - { label: "Narrative Paragraphs", name: body, widget: markdown }

  - name: resume
    label: "Resume Page"
    files:
      - name: resume
        file: "src/content/pages/resume.md"
        label: "Resume Content"
        fields:
          - { label: "Professional Overview", name: overview, widget: text }
          - label: "Work Experience"
            name: experience
            widget: list
            summary: "{{title}}"
            fields:
              - { label: "Job Title", name: title, widget: string }
              - { label: "Organization", name: org, widget: string, required: false }
              - { label: "Period", name: period, widget: string }
              - label: "Bullets"
                name: bullets
                widget: list
                field: { label: "Bullet", name: item, widget: string }
          - label: "Education"
            name: education
            widget: list
            summary: "{{degree}}"
            fields:
              - { label: "Degree", name: degree, widget: string }
              - { label: "Institution", name: org, widget: string }
              - { label: "Period", name: period, widget: string }
              - { label: "Note", name: note, widget: string, required: false }
          - label: "Skills"
            name: skills
            widget: list
            field: { label: "Skill", name: item, widget: string }
          - label: "Courses & Certifications"
            name: courses
            widget: list
            summary: "{{name}}"
            fields:
              - { label: "Course Name", name: name, widget: string }
              - { label: "Provider", name: org, widget: string }
              - { label: "Year", name: year, widget: string }

  - name: contact
    label: "Contact Page"
    files:
      - name: contact
        file: "src/content/pages/contact.md"
        label: "Contact Page Content"
        fields:
          - { label: "Lede (before the email link)", name: lede, widget: string }
      - name: site
        file: "src/content/pages/site.md"
        label: "Contact Info (email, phone, socials, location)"
        fields:
          - { label: "Email", name: email, widget: string, hint: "Also shown in the footer and on the Resume page." }
          - { label: "Phone", name: phone, widget: string }
          - { label: "Location", name: location, widget: string }
          - { label: "LinkedIn URL", name: linkedin, widget: string }
          - { label: "Instagram URL", name: instagram, widget: string }
          - { label: "Instagram Handle (displayed text, e.g. '@leila.karlene')", name: instagramHandle, widget: string }
